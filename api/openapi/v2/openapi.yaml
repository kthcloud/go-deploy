info:
  contact:
    name: Support
    url: https://github.com/kthcloud/go-deploy
  description: This is the API explorer for the go-deploy API. You can use it as a
    reference for the API endpoints.
  license:
    name: MIT License
    url: https://github.com/kthcloud/go-deploy?tab=MIT-1-ov-file#readme
  termsOfService: http://swagger.io/terms/
  title: go-deploy API
  version: '1.0'
openapi: 3.0.3
paths:
  /v2/deployments:
    get:
      description: List deployments
      parameters:
      - description: List all
        in: query
        name: all
        schema:
          type: boolean
      - description: Filter by user ID
        in: query
        name: userId
        schema:
          type: string
      - description: Include shared
        in: query
        name: shared
        schema:
          type: boolean
      - description: Page number
        in: query
        name: page
        schema:
          type: integer
      - description: Number of items per page
        in: query
        name: pageSize
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DeploymentRead'
                type: array
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - ApiKeyAuth: []
      - KeycloakOAuth: []
      summary: List deployments
      tags:
      - Deployment
      operationId: GetDeployments
    post:
      description: Create deployment
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/DeploymentCreate'
                description: Deployment body
                summary: body
        description: Deployment body
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentRead'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - ApiKeyAuth: []
      - KeycloakOAuth: []
      summary: Create deployment
      tags:
      - Deployment
      operationId: PostDeployments
  /v2/deployments/{deploymentId}:
    delete:
      description: Delete deployment
      parameters:
      - description: Deployment ID
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
