# kind cluster configuration for local dev
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    extraPortMappings:
      # Ingress HTTP
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      # Ingress HTTPS
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
      # MongoDB
      - containerPort: 30017
        hostPort: 30017
        protocol: TCP
      # Redis
      - containerPort: 30379
        hostPort: 30379
        protocol: TCP
      # Keycloak
      - containerPort: 30088
        hostPort: 30088
        protocol: TCP
      # Harbor
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP
