apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: keycloak
data:
  realm.json: |
    [
      {
        "realm": "cloud",
        "enabled": true,
        "clients": [
          {
            "clientId": "go-deploy",
            "protocol": "openid-connect",
            "publicClient": false,
            "enabled": true,
            "secret": "dev-secret",
            "directAccessGrantsEnabled": true,
            "serviceAccountsEnabled": true,
            "redirectUris": ["http://*", "https://*"],
            "webOrigins": ["http://*", "https://*"],
            "protocolMappers": [
              {
                "name": "groups",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-group-membership-mapper",
                "consentRequired": false,
                "config": {
                  "access.token.claim": "true",
                  "claim.name": "groups",
                  "full.path": "false",
                  "id.token.claim": "true",
                  "introspection.token.claim": "true",
                  "lightweight.claims": "false",
                  "userinfo.token.claim": "true"
                }
              }
            ]
          }
        ],
        "groups": [
          { "name": "admin" },
          { "name": "default" },
          { "name": "base" },
          { "name": "power" }
        ]
      }
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      volumes:
        - name: vol-keycloak-realm-import
          configMap:
            name: keycloak-realm
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.1
          args:
            - start-dev
            - --import-realm
          volumeMounts:
            - mountPath: /opt/keycloak/data/import
              name: vol-keycloak-realm-import
          env:
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: admin
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: forwarded
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: {{ .Values.ports.keycloak }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
spec:
  ingressClassName: nginx
  rules:
    - host: iam.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
