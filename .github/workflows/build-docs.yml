name: Build docs

on:
  pull_request:
    branches: ["main"]
    paths:
      - "routers/**"
      - ".github/workflows/build-docs.yml"

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate OpenAPI code and docs
        run: go generate ./api/... ./models/...
